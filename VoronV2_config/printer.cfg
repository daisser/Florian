#####################################################################
#  MCU Settings
#####################################################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_59004D000E51383438343939-if00
#	MCU for X/Y/E steppers main MCU
##	[X in X] - B Motor
##	[Y in Y] - A Motor
##	[E in E0] - Extruder
##--------------------------------------------------------------------

[mcu rpi]
##  MCU for adxl345 acelometer
##--------------------------------------------------------------------
serial: /tmp/klipper_host_mcu
##--------------------------------------------------------------------


#####################################################################
#  Printer Settings
#####################################################################
[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4500
#max_accel: 10000
#max_accel_to_decel:10000
max_z_velocity: 30
max_z_accel: 400
square_corner_velocity: 5.0

[virtual_sdcard]
path: /home/pi/gcode_files

[display_status]

[pause_resume]
#recover_velocity: 250

#[gcode_arcs]
#resolution: 0.2

[idle_timeout]
gcode:
  STATUS_OFF
  TURN_OFF_HEATERS
  SET_TEMPERATURE_FAN_TARGET temperature_fan=Raspbery_fan TARGET=55
  M18
timeout: 1800

[firmware_retraction]
retract_length: 0
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30

