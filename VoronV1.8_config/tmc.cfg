#####################################################################
#  EXTRUDER TMC Settings
#####################################################################
[tmc2209 extruder]
uart_pin: EBB:PA15 #P1.4
interpolate: True
run_current: 0.45          #Max Wert ist 0.45
hold_current: 0.1
stealthchop_threshold: 0
sense_resistor: 0.110

#####################################################################
#  X & Y TMC Settings
#####################################################################
[tmc2209 stepper_x]
uart_pin: P1.10
interpolate: True
run_current: 0.85
hold_current: 0.6
stealthchop_threshold: 1
#sense_resistor: 0.110
#driver_PWM_GRAD: 10

[tmc2209 stepper_y]
uart_pin: P1.9
interpolate: True
run_current: 0.85
hold_current: 0.6
stealthchop_threshold: 1
#sense_resistor: 0.110
#driver_PWM_GRAD: 10

#####################################################################
#  Z TMC Settings
#####################################################################
[tmc2209 stepper_z]
uart_pin: P1.8
interpolate: true
run_current: 0.65                   #max 1.2A
hold_current: 0.45
#sense_resistor: 0.110
#stealthchop_threshold: 9999

[tmc2209 stepper_z1]
uart_pin: P1.1
interpolate: true
run_current: 0.65                   #max 1.2A
hold_current: 0.45
#sense_resistor: 0.110
#stealthchop_threshold: 9999

