# Enable object exclusion
[exclude_object]

[respond]

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    BASE_CANCEL_PRINT
    CLEAR_PAUSE
    END_PRINT

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: BASE_PAUSE
variable_extrude: 1.0
gcode:
  ##### store min and current extrution temp in variable ##### 
  {% set extruder_min = printer.configfile.config.extruder.min_extrude_temp|int + 30 %}
  {% set extruder_target = printer.extruder.target %}
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### either use brush bin position or user defined ##### 
  {% set x_park = params.X|default(250)|int %}
  {% set y_park = params.Y|default(10)|int %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
    {% set z_safe = 2.0 %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  ##### added because of motion sensor #####
  ## not sure why but sometime it generate an runout event while heatsoak
  {% if printer.extruder.can_extrude|lower == 'false' %}
      {action_respond_info("Extruder Temp to low heat to %2dC" % extruder_min)}
      M109 S{extruder_min} ; heat extruder and wait
  {% endif %}
  SAVE_GCODE_STATE NAME=BEFORE_PAUSE
  BASE_PAUSE
  G91
  G1 E-{E} F2100
  G1 Z{z_safe} F100
  G90
  {% if printer.toolhead.position.z|float < 10 %}
    G0 Z10 F1200 ; lift nozzle
    {% endif %}
  G1 X{x_park} Y{y_park} F10000 ; park nozzle at brush bin or user defined
  # restore old extruder temperature
  M109 S{extruder_target}


[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: BASE_RESUME
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  G91
  G1 E{E} F2100
  RESTORE_GCODE_STATE NAME=BEFORE_PAUSE
  BASE_RESUME {get_params}
  M117 Printing


[gcode_macro START_PRINT_FIX]
gcode:
    {% set BED = params.BED|default(90)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(250)|float %}
    {% set CHAMBER = params.CHAMBER|default(40)|float %}
    {% set AreaStart = params.AREA_START|default("0,0")|string %}         #Bed-Mesh partziel start
    {% set AreaEnd = params.AREA_END|default("0,0")|string %}             #Bed-Mesh partziel end
    {% set FILAMENT_TYPE = params.FILAMENT|default(now)|string %}
    SET_GCODE_OFFSET Z=0                                                  # Reset the G-Code Z offset (adjust Z offset if needed)
    M117 Homing..
    Homing
    {% if FILAMENT_TYPE %}
        #SET_GCODE_OFFSET Z=-0.01
        {action_respond_info(FILAMENT_TYPE)}
    {% else %}
        {action_respond_info("ist nicht da")}
    {% endif %}
    M221 S100
    STATUS_HEATING
    M106 S128                                                             # part cooling fan go up to 50%
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=50                     # Star Heating and wait for extruder temp
    M190 S{BED}                                                           # Start bed heating an wait for bed temp
    SET_TEMPERATURE_FAN_TARGET temperature_fan=Enclosure TARGET=37.6

    {% if "PLA" in FILAMENT_TYPE or "FLEX" in FILAMENT_TYPE or "PET" in FILAMENT_TYPE  %}
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM=20   # wait for temp
        {action_respond_info(FILAMENT_TYPE)}
        {action_respond_info("wait temp chamber over 20")}
      {% else %}
        M117 Wait Chamber Temp..
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM=36   # wait for temp
        {action_respond_info("wait temp chamber over 36 ")}
        {action_respond_info(FILAMENT_TYPE)}
    {% endif %}

    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber_fan TARGET={CHAMBER}
    M106 S0
    M83                                                                   # extruder relative mode
    STATUS_CLEANING
    G92 E0 
    G90                                                                   # Use absolute coordinates
    BED_MESH_CLEAR
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=170                     # aufwärmen zum cleanen
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM=140
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=50                     # Star Heating and wait for extruder temp
    CLEAN_NOZZLE
    STATUS_MESHING
    Z_AUTOCALIBRATE
    {% if params.AREA_START and params.AREA_END %}
       #BED_MESH_CALIBRATE AREA_START={AreaStart} AREA_END={AreaEnd}
        {action_respond_info("Mesh partiell")}
    {% else %}
        {action_respond_info("Kein Mesh")}
    {% endif %}
    M106 S0
    M117 CLEAN NOZZLE
    G1 X150 F8000                                                         # Move to start position
    M109 S{EXTRUDER}                                                      # Star Heating and wait for extruder temp
    CLEAN_NOZZLE
    STATUS_PRINTING
    M117 Printing
    


[gcode_macro Z_TILT]
#rename_existing: Z_TILT_ADJUST
gcode:
    Homing
    Z_TILT_ADJUST
    G1 Z10 F800
    G28 Z


[gcode_macro END_PRINT]
#rename_existing: END_PRINT_NEU
gcode:
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 5.0) %}
      {% set z_safe = 5.0 %}
    {% else %}
      {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    G91
    G1 E-0.5 F500 
    G1 Z{z_safe} F900
    TURN_OFF_HEATERS
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber_fan TARGET=0
    SET_TEMPERATURE_FAN_TARGET temperature_fan=Enclosure TARGET=0
    M106 S255
    G90
    G0 X295 Y295 F9000
    STATUS_STANDBY
    CLEAR_PAUSE
    G4 P25000
    M106 S0
   
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
; gcode parameters
variable_parameter_AREA_START : 0,0
variable_parameter_AREA_END : 0,0
; the clearance between print area and probe area 
variable_mesh_area_offset : 5.0
; number of sample per probe point
variable_probe_samples : 2
; minimum probe count
variable_min_probe_count : 3
; scale up the probe count, should be 1.0 ~ < variable_max_probe_count/variable_min_probe_count
variable_probe_count_scale_factor : 1.0
gcode:
    M117 Bed Mesh
    {% if params.AREA_START and params.AREA_END %}
        {% set bedMeshConfig = printer["configfile"].config["bed_mesh"] %}
        {% set safe_min_x = bedMeshConfig.mesh_min.split(",")[0]|float %}
        {% set safe_min_y = bedMeshConfig.mesh_min.split(",")[1]|float %}
        {% set safe_max_x = bedMeshConfig.mesh_max.split(",")[0]|float %}
        {% set safe_max_y = bedMeshConfig.mesh_max.split(",")[1]|float %}

        {% set area_min_x = params.AREA_START.split(",")[0]|float %}
	{% set area_min_y = params.AREA_START.split(",")[1]|float %}
	{% set area_max_x = params.AREA_END.split(",")[0]|float %}
	{% set area_max_y = params.AREA_END.split(",")[1]|float %}

        {% set meshPointX = bedMeshConfig.probe_count.split(",")[0]|int %}
        {% set meshPointY = bedMeshConfig.probe_count.split(",")[1]|int %}
	
	{% set meshMaxPointX = meshPointX %}
	{% set meshMaxPointY = meshPointY %}


        {% if (area_min_x < area_max_x) and (area_min_y < area_max_y) %}
            {% if area_min_x - mesh_area_offset >=  safe_min_x %}
                {% set area_min_x = area_min_x - mesh_area_offset %}
            {% else %}
                {% set area_min_x = safe_min_x %}
            {% endif %}

            {% if area_min_y - mesh_area_offset >=  safe_min_y %}
                {% set area_min_y = area_min_y - mesh_area_offset %}
            {% else %}
                {% set area_min_y = safe_min_y %}
            {% endif %}

            {% if area_max_x + mesh_area_offset <=  safe_max_x %}
                {% set area_max_x = area_max_x + mesh_area_offset %}
            {% else %}
                {% set area_max_x = safe_max_x %}
            {% endif %}

            {% if area_max_y + mesh_area_offset <=  safe_max_y %}
                {% set area_max_y = area_max_y + mesh_area_offset %}
            {% else %}
                {% set area_max_y = safe_max_y %}
            {% endif %}

            {% set meshPointX = (meshPointX * (area_max_x - area_min_x) / (safe_max_x - safe_min_x) * probe_count_scale_factor)|round(0)|int %}
            {% if meshPointX < min_probe_count %}
                {% set meshPointX = min_probe_count %}
            {% endif %}
	    {% if meshPointX > meshMaxPointX %}
                {% set meshPointX = meshMaxPointX %}
            {% endif %}

            {% set meshPointY = (meshPointY * (area_max_y -area_min_y ) / (safe_max_y - safe_min_y) * probe_count_scale_factor )|round(0)|int %}
            {% if meshPointY < min_probe_count %}
                {% set meshPointY = min_probe_count %}
            {% endif %}
	    {% if meshPointY > meshMaxPointY %}
                {% set meshPointY = meshMaxPointY %}
            {% endif %}

            BED_MESH_CALIBRATE_BASE mesh_min={area_min_x},{area_min_y} mesh_max={area_max_x},{area_max_y} probe_count={meshPointX},{meshPointY} samples={probe_samples|int}
        {% else %}
            BED_MESH_CALIBRATE_BASE
        {% endif %}
    {% else %}
        BED_MESH_CALIBRATE_BASE
    {% endif %}


[gcode_macro M204]
description: Set and limit acceleration to cfg value
rename_existing: M204.1
gcode:
  # get accel from parameter
  {% if 'S' in params %}
    {% set param_accel = params.S|float %}
  {% elif 'P' in params %}
    {% set param_accel = params.P|float %}
  {% elif 'T' in params %}
    {% set param_accel = params.T|float %}
  {% endif %}
  # calc accel_to deccel
  {% set param_accel_to_decel = (param_accel * 2.0 / 4.0) %}
  # get limits from config
  {% set max_accel = printer.configfile.settings.printer.max_accel|float %}
  {% set max_accel_to_decel = printer.configfile.settings.printer.max_accel_to_decel|float %}
  # limit values to config values 
  {% if param_accel < max_accel %}
    {% set accel = param_accel|int %}
  {% else %}
    {% set accel = max_accel|int %}
  {% endif%}
  {% if param_accel_to_decel < max_accel_to_decel %}
    {% set accel_to_decel = param_accel_to_decel|int %}
  {% else %}
    {% set accel_to_decel = max_accel_to_decel|int %}
  {% endif %}
  # end of definition
  SET_VELOCITY_LIMIT ACCEL={accel} ACCEL_TO_DECEL={accel_to_decel}

