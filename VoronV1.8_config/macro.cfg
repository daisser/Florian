[gcode_macro LOAD_FILAMENT]
#rename_existing: 
gcode:
  {% set extruder_target = printer.extruder.target %}
  {% set extruder_min = printer.configfile.config.extruder.min_extrude_temp|int +50 %}
  {% set extrude_only_distance = printer.configfile.config.extruder.max_extrude_only_distance %}

  {% if printer.extruder.target < printer.configfile.config.extruder.min_extrude_temp|int +35 %}
       
        	M104 S{extruder_min}  
        	{action_respond_info("default temp")}
      
  {% else %}
      	M104 S{extruder_target}
        {action_respond_info("current temp")}
  {% endif %}
  TEMPERATURE_WAIT SENSOR="extruder" MINIMUM=235
  G1 E{extrude_only_distance} F300
  G92 E0
  M117 Load complete



[gcode_macro UNLOAD_FILAMENT]
#rename_existing: 
gcode:
  {% set extruder_target = printer.extruder.target %}
  {% set extruder_min = printer.configfile.config.extruder.min_extrude_temp|int +50 %}
  {% set extrude_only_distance = printer.configfile.config.extruder.max_extrude_only_distance %}

  {% if printer.extruder.target < printer.configfile.config.extruder.min_extrude_temp|int +35 %}
        	M104 S{extruder_min}  
        	{action_respond_info("default temp")} 
    {% else %}
      	M104 S{extruder_target}
        {action_respond_info("current temp")}
  {% endif %}
  TEMPERATURE_WAIT SENSOR="extruder" MINIMUM=235
  G1 E-{extrude_only_distance} F300
  G92 E0
  M117 UnLoad complete

[filament_motion_sensor encoder_sensor]
detection_length: 6
#   The minimum length of filament pulled through the sensor to trigger
#   a state change on the switch_pin
#   Default is 7 mm.
extruder: extruder
#   The name of the extruder section this sensor is associated with.
#   This parameter must be provided.
switch_pin: P1.26
# changing the switch_pin name according to your motherboard
pause_on_runout: True
runout_gcode:
    Pause
    RESPOND PREFIX=telegram: MSG="Filament runout"
    M117 Filament runout
