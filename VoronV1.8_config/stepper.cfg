[stepper_x]
##	Connected to X on mcu_xye (B Motor)
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400
endstop_pin: EBB:PB7
position_min: -0.5
position_endstop: 302.5   
position_max: 302.5
homing_speed: 60
homing_retract_dist: 5
second_homing_speed: 5
homing_positive_dir: true

[stepper_y]
##	Connected to Y on mcu_xye (A Motor)
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400
endstop_pin: P1.28
position_min: -0.5
position_endstop: 307 #308.5
position_max: 307
homing_speed: 60
homing_retract_dist: 5
second_homing_speed: 5
homing_positive_dir: true

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z MCU - In X Position
## Z0 Stepper - Left font
[stepper_z]
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
rotation_distance: 4.0
microsteps: 16
endstop_pin: P1.27
#endstop_pin: probe:z_virtual_endstop
position_endstop: 2.025
position_max: 282
position_min: -5
homing_speed: 7
second_homing_speed: 5
homing_retract_dist: 2.5

##	Z MCU - In Y Position
##	Z1 Stepper - left rear
[stepper_z1]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
rotation_distance: 4.0
microsteps: 16

