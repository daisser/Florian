# Example neopixel configuration:
[neopixel Druckraum]
pin: P1.24
# #   The pin connected to the neopixel. This parameter must be
# #   provided.
chain_count: 62
# #   The number of Neopixel chips that are "daisy chained" to the
# #   provided pin. The default is 1 (which indicates only a single
# #   Neopixel is connected to the pin).
color_order: GRB
# #   Set the pixel order required by the LED hardware. Options are GRB,
# #   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 0.0
initial_GREEN: 0.5
initial_BLUE: 0.0
# #   Sets the initial LED color of the Neopixel. Each value should be
# #   between 0.0 and 1.0. The WHITE option is only available on RGBW
# #   LEDs. The default for each color is 0.#
#
# Most configuration for the macros can be done by modifying the variables in the _sb_vars macro
# at the start of this file. 
#
# MACROS
#
# The following status macros are available:
#    STATUS_READY
#    STATUS_OFF
#    STATUS_BUSY
#    STATUS_HEATING
#    STATUS_LEVELING
#    STATUS_HOMING
#    STATUS_CLEANING
#    STATUS_MESHING
#    STATUS_CALIBRATING_Z
#
# Contributed by Voron discord users wile.e, Tetsunosuke, and etherwalker
_SET_LED
[gcode_macro _Druckraum]
# User settings for the StealthBurner status leds. You can change the status colors and led
# configurations for the logo and nozzle here.
variable_colors: {
        'Druckraum': { # Colors for logo states
            'busy': {'r': 0.4, 'g': 0.0, 'b': 0.0},
            'cleaning': {'r': 0.0, 'g': 0.02, 'b': 0.5},
            'calibrating_z': {'r': 0.8, 'g': 0., 'b': 0.35},
            'heating': {'r': 0.3, 'g': 0.18, 'b': 0.0},
            'homing': {'r': 0.0, 'g': 0.6, 'b': 0.2},
            'leveling': {'r': 0.5, 'g': 0.1, 'b': 0.4},
            'meshing': {'r': 0.2, 'g': 1.0, 'b': 0.0},
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0},
            'printing': {'r': 1.0, 'g': 0.0, 'b': 0.0},
            'standby': {'r': 0.0, 'g': 0.5, 'b': 0.0},
        },
    }
variable_Druckraum_led_name:         "Druckraum" 
# The name of the addressable LED chain that contains the logo LED(s)
variable_Druckraum_idx:              "62" 
# A comma-separated list of indexes LEDs in the logo
#variable_nozzle_led_name:       "Druckraum"
# The name of the addressable LED chain that contains the nozzle LED(s). This will
# typically be the same LED chain as the logo.
#variable_nozzle_idx:            "Druckraum"
# A comma-separated list of indexes of LEDs in the nozzle

variable_thermal_config: {
        'extruder': {
            'cool_temp': 40,
            'leds': 'Druckraum',
        },
    }
# temperatures at which cooling will be considered complete

gcode:
    ; Do nothing

[gcode_macro _set_Druckraum]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set led = params.LED|string %}
    {% set idx = (params.IDX|string).split(',') %}
    {% set transmit_last = params.TRANSMIT|default(1) %}
    
    {% for led_index in idx %}
        {% set transmit=transmit_last if loop.last else 0 %}
        _set_led led={led} red={red} green={green} blue={blue}  index={led_index} transmit={transmit}
    {% endfor %}

[gcode_macro _set_Druckraum_by_name]
gcode:
    {% set leds_name = params.LEDS %}
    {% set color_name = params.COLOR %}
    {% set color = printer["gcode_macro _Druckraum"].colors[leds_name][color_name] %}
    {% set led = printer["gcode_macro _Druckraum"][leds_name + "_led_name"] %}
    {% set idx = printer["gcode_macro _Druckraum"][leds_name + "_idx"] %}
    {% set transmit = params.TRANSMIT|default(1) %}

    _set_Druckraum led={led} red={color.r} green={color.g} blue={color.b} idx="{idx}" transmit={transmit}

[gcode_macro _set_Druckraum_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set led = printer["gcode_macro _Druckraum"].Druckraum_led_name %}
    {% set idx = printer["gcode_macro _Druckraum"].Druckraum_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}
 
    _set_Druckraum_leds led={led} red={red} green={green} blue={blue} idx="{idx}" transmit={transmit}
 
[gcode_macro set_Druckraum_leds_off]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_Druckraum_leds red=0 blue=0 green=0 transmit={transmit}

[gcode_macro status_off]
gcode:
    _set_Druckraum_leds_off transmit=0

[gcode_macro status_ready]
gcode:
    _set_Druckraum_by_name leds="Druckraum" color="standby" transmit=0
    #_set_Druckraums_by_name leds="nozzle" color="standby" transmit=1

[gcode_macro status_busy]
gcode:
    _set_Druckraum_by_name leds="Druckraum" color="busy" transmit=0
    #set_nozzle_leds_on

[gcode_macro status_heating]
gcode:
    _set_Druckraum_by_name leds="Druckraum" color="heating" transmit=0
    #_set_Druckraums_by_name leds="nozzle" color="heating" transmit=1

[gcode_macro status_leveling] 
gcode:
