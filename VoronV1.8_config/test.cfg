    #set_nozzle_leds_on

[gcode_macro status_homing]
gcode:
    _set_Druckraum_by_name leds="Druckraum" color="homing" transmit=0
    #set_nozzle_leds_on

[gcode_macro status_cleaning]
gcode:
    _set_Druckraum_by_name leds="Druckraum" color="cleaning" transmit=0
    #set_nozzle_leds_on

[gcode_macro status_meshing]
gcode:
    _set_Druckraum_by_name leds="Druckraum" color="meshing" transmit=0
    set_nozzle_leds_on

[gcode_macro status_calibrating_z]
gcode:
    _set_Druckraum_by_name leds="Druckraum" color="calibrating_z" transmit=0
    #set_nozzle_leds_on

[gcode_macro status_printing]
gcode:
    _set_Druckraums_by_name leds="Druckraum" color="printing" transmit=0
    #set_nozzle_leds_on
