[force_move]
enable_force_move: True
#   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION
#   extended G-Code commands. The default is false.


[safe_z_home]
#home_xy_position: 150,127 
home_xy_position: 302.5,282.0
speed: 200
z_hop: 5
z_hop_speed: 5
#move_to_previous: False
#   When set to True, xy are reset to their previous positions after z
#   homing. The default is False.

[gcode_macro Homing]
#rename_existing: G28
gcode:
    {% set status = printer.idle_timeout.state %}
    status_homing
    
    {% if "x" not in printer.toolhead.homed_axes %}
      G28 X
    {% endif %}

    {% if "y" not in printer.toolhead.homed_axes %}
      G28 Y
    {% endif %}

    {% if "z" not in printer.toolhead.homed_axes %}
      G28 Z
    {% endif %}

    {% if "Printing" in printer.idle_timeout.state  %}
      #M117 gott mode
      {action_respond_info("kein center position")}
    {%else %}
      G0 Z25 F600 ; lift nozzle
      G0 X150 Y127 F6000
      {action_respond_info("center position")}
    {% endif %}


      

